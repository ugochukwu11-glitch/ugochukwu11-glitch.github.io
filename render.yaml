services:
  - type: web
    name: portfolio-gemini-live-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORTFOLIO_KNOWLEDGE_TEXT
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ugochukwu11-glitch.github.io
